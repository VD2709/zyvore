<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
    <defs>
        <linearGradient id="awardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F59E0B"/>
            <stop offset="100%" stop-color="#D97706"/>
        </linearGradient>
        <linearGradient id="awardGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FBBF24"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
        <filter id="awardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Outer ring -->
    <circle cx="100" cy="100" r="90" fill="none" stroke="url(#awardGrad)" stroke-width="2" opacity="0.3"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="url(#awardGrad)" stroke-width="1" opacity="0.2"/>

    <!-- Medal -->
    <g filter="url(#awardShadow)">
        <circle cx="100" cy="100" r="60" fill="url(#awardGold)"/>
    </g>
    <circle cx="100" cy="100" r="50" fill="none" stroke="#FEF3C7" stroke-width="2" opacity="0.5"/>

    <!-- Star -->
    <path d="M100 65L110 85L132 85L115 98L122 120L100 107L78 120L85 98L68 85L90 85Z" fill="white"/>

    <!-- Ribbon -->
    <path d="M85 130L75 170L90 160L100 175L110 160L125 170L115 130" fill="url(#awardGrad)"/>
    <path d="M85 130L75 170L90 160L100 175L110 160L125 170L115 130" fill="none" stroke="#D97706" stroke-width="1"/>

    <!-- Text -->
    <text x="100" y="145" text-anchor="middle" font-size="10" fill="#92400E" font-family="Inter,sans-serif" font-weight="700">BEST</text>
    <text x="100" y="157" text-anchor="middle" font-size="8" fill="#92400E" font-family="Inter,sans-serif" font-weight="600">CPaaS 2026</text>

    <!-- Sparkles -->
    <g fill="#FBBF24" opacity="0.6">
        <circle cx="40" cy="50" r="3">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="160" cy="60" r="2">
            <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="150" cy="150" r="3">
            <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="140" r="2">
            <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg>