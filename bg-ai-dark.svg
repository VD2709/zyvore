<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
    <defs>
        <linearGradient id="aiBg1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F0A1E"/>
            <stop offset="50%" stop-color="#1A1035"/>
            <stop offset="100%" stop-color="#0D1B2A"/>
        </linearGradient>
        <linearGradient id="aiGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="aiGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1"/>
        </linearGradient>
        <filter id="aiBlur">
            <feGaussianBlur stdDeviation="60"/>
        </filter>
    </defs>

    <!-- Dark background -->
    <rect width="1920" height="1080" fill="url(#aiBg1)"/>

    <!-- Glow effects -->
    <ellipse cx="400" cy="300" rx="400" ry="300" fill="url(#aiGlow1)" filter="url(#aiBlur)"/>
    <ellipse cx="1500" cy="700" rx="400" ry="300" fill="url(#aiGlow2)" filter="url(#aiBlur)"/>
    <ellipse cx="960" cy="540" rx="300" ry="200" fill="url(#aiGlow1)" filter="url(#aiBlur)" opacity="0.5"/>

    <!-- Grid pattern -->
    <g opacity="0.03" stroke="white" stroke-width="0.5">
        <line x1="0" y1="135" x2="1920" y2="135"/>
        <line x1="0" y1="270" x2="1920" y2="270"/>
        <line x1="0" y1="405" x2="1920" y2="405"/>
        <line x1="0" y1="540" x2="1920" y2="540"/>
        <line x1="0" y1="675" x2="1920" y2="675"/>
        <line x1="0" y1="810" x2="1920" y2="810"/>
        <line x1="0" y1="945" x2="1920" y2="945"/>
        <line x1="160" y1="0" x2="160" y2="1080"/>
        <line x1="320" y1="0" x2="320" y2="1080"/>
        <line x1="480" y1="0" x2="480" y2="1080"/>
        <line x1="640" y1="0" x2="640" y2="1080"/>
        <line x1="800" y1="0" x2="800" y2="1080"/>
        <line x1="960" y1="0" x2="960" y2="1080"/>
        <line x1="1120" y1="0" x2="1120" y2="1080"/>
        <line x1="1280" y1="0" x2="1280" y2="1080"/>
        <line x1="1440" y1="0" x2="1440" y2="1080"/>
        <line x1="1600" y1="0" x2="1600" y2="1080"/>
        <line x1="1760" y1="0" x2="1760" y2="1080"/>
    </g>

    <!-- AI circuit lines -->
    <g stroke="#6366F1" stroke-width="1" opacity="0.1" fill="none">
        <path d="M100 200L300 200L350 250L550 250"/>
        <path d="M100 200L100 400L200 450L400 450"/>
        <path d="M550 250L700 250L750 300L900 300"/>
        <path d="M400 450L400 600L500 650L700 650"/>
        <path d="M900 300L900 500L1000 550L1200 550"/>
        <path d="M700 650L800 700L1000 700L1050 750L1250 750"/>
        <path d="M1200 550L1350 550L1400 600L1600 600"/>
        <path d="M1250 750L1250 900L1350 950L1550 950"/>
        <path d="M1600 600L1750 600L1800 650L1920 650"/>
    </g>

    <!-- AI nodes -->
    <g opacity="0.15">
        <circle cx="100" cy="200" r="4" fill="#6366F1"/>
        <circle cx="300" cy="200" r="4" fill="#6366F1"/>
        <circle cx="550" cy="250" r="4" fill="#06B6D4"/>
        <circle cx="900" cy="300" r="4" fill="#6366F1"/>
        <circle cx="400" cy="450" r="4" fill="#06B6D4"/>
        <circle cx="700" cy="650" r="4" fill="#6366F1"/>
        <circle cx="1200" cy="550" r="4" fill="#06B6D4"/>
        <circle cx="1250" cy="750" r="4" fill="#6366F1"/>
        <circle cx="1600" cy="600" r="4" fill="#06B6D4"/>
        <circle cx="1550" cy="950" r="4" fill="#6366F1"/>
    </g>

    <!-- Floating particles -->
    <g opacity="0.2">
        <circle cx="200" cy="300" r="2" fill="#6366F1">
            <animate attributeName="cy" values="300;280;300" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="600" cy="500" r="1.5" fill="#06B6D4">
            <animate attributeName="cy" values="500;480;500" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1000" cy="400" r="2" fill="#8B5CF6">
            <animate attributeName="cy" values="400;380;400" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1400" cy="600" r="1.5" fill="#EC4899">
            <animate attributeName="cy" values="600;580;600" dur="3.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1700" cy="300" r="2" fill="#6366F1">
            <animate attributeName="cy" values="300;280;300" dur="4.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="300" cy="800" r="1.5" fill="#06B6D4">
            <animate attributeName="cy" values="800;780;800" dur="3.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="800" cy="900" r="2" fill="#8B5CF6">
            <animate attributeName="cy" values="900;880;900" dur="4.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1600" cy="800" r="1.5" fill="#EC4899">
            <animate attributeName="cy" values="800;780;800" dur="3.3s" repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Neural network connections -->
    <g stroke="#6366F1" stroke-width="0.5" opacity="0.08">
        <line x1="200" y1="300" x2="600" y2="500"/>
        <line x1="600" y1="500" x2="1000" y2="400"/>
        <line x1="1000" y1="400" x2="1400" y2="600"/>
        <line x1="1400" y1="600" x2="1700" y2="300"/>
        <line x1="300" y1="800" x2="800" y2="900"/>
        <line x1="800" y1="900" x2="1600" y2="800"/>
        <line x1="200" y1="300" x2="300" y2="800"/>
        <line x1="1700" y1="300" x2="1600" y2="800"/>
    </g>
</svg>