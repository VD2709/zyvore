<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
    <defs>
        <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#818CF8"/>
        </linearGradient>
        <filter id="finShadow" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
        </filter>
    </defs>

    <!-- Background -->
    <circle cx="200" cy="150" r="130" fill="url(#finGrad)" opacity="0.05"/>

    <!-- Phone with wallet -->
    <g filter="url(#finShadow)">
        <rect x="140" y="40" width="120" height="220" rx="20" fill="#1E293B"/>
    </g>
    <rect x="148" y="55" width="104" height="190" rx="12" fill="#0F172A"/>

    <!-- Phone screen content -->
    <rect x="155" y="65" width="90" height="60" rx="8" fill="url(#cardGrad)"/>
    <text x="200" y="90" text-anchor="middle" font-size="10" fill="white" font-family="Inter,sans-serif" font-weight="600">Zyvore Pay</text>
    <text x="200" y="110" text-anchor="middle" font-size="18" fill="white" font-family="Inter,sans-serif" font-weight="700">$2,450.00</text>

    <!-- Transaction list -->
    <rect x="155" y="135" width="90" height="28" rx="4" fill="#1E293B"/>
    <circle cx="165" cy="149" r="6" fill="#10B981"/>
    <text x="178" y="147" font-size="8" fill="#94A3B8" font-family="Inter,sans-serif">Payment received</text>
    <text x="178" y="157" font-size="8" fill="#10B981" font-family="Inter,sans-serif" font-weight="600">+$150.00</text>

    <rect x="155" y="168" width="90" height="28" rx="4" fill="#1E293B"/>
    <circle cx="165" cy="182" r="6" fill="#F59E0B"/>
    <text x="178" y="180" font-size="8" fill="#94A3B8" font-family="Inter,sans-serif">Transfer sent</text>
    <text x="178" y="190" font-size="8" fill="#EF4444" font-family="Inter,sans-serif" font-weight="600">-$75.00</text>

    <rect x="155" y="201" width="90" height="28" rx="4" fill="#1E293B"/>
    <circle cx="165" cy="215" r="6" fill="#6366F1"/>
    <text x="178" y="213" font-size="8" fill="#94A3B8" font-family="Inter,sans-serif">Bill payment</text>
    <text x="178" y="223" font-size="8" fill="#EF4444" font-family="Inter,sans-serif" font-weight="600">-$45.00</text>

    <!-- Home indicator -->
    <rect x="185" y="240" width="30" height="4" rx="2" fill="#334155"/>

    <!-- Floating cards -->
    <!-- Credit card -->
    <g filter="url(#finShadow)">
        <rect x="50" y="80" width="80" height="50" rx="8" fill="url(#cardGrad)" transform="rotate(-10 90 105)"/>
    </g>
    <rect x="60" y="90" width="20" height="14" rx="2" fill="#F59E0B" transform="rotate(-10 90 105)"/>
    <text x="60" y="120" font-size="8" fill="white" font-family="Inter,sans-serif" transform="rotate(-10 90 105)">**** 4582</text>

    <!-- Coin -->
    <g filter="url(#finShadow)">
        <circle cx="320" cy="100" r="25" fill="#F59E0B"/>
    </g>
    <circle cx="320" cy="100" r="20" fill="none" stroke="#D97706" stroke-width="2"/>
    <text x="320" y="106" text-anchor="middle" font-size="16" fill="white" font-family="Inter,sans-serif" font-weight="700">$</text>

    <!-- Chart card -->
    <g filter="url(#finShadow)">
        <rect x="290" y="180" width="90" height="60" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    </g>
    <text x="300" y="195" font-size="8" fill="#64748B" font-family="Inter,sans-serif">Revenue</text>
    <text x="300" y="210" font-size="14" fill="#10B981" font-family="Inter,sans-serif" font-weight="700">+24%</text>
    <polyline points="300,230 315,220 330,225 345,210 360,215 375,200" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Security shield -->
    <g filter="url(#finShadow)">
        <path d="M70 200L85 190L100 200L100 220C100 230 92 238 85 242C78 238 70 230 70 220Z" fill="#10B981"/>
    </g>
    <path d="M78 215L83 220L93 210" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Connection lines -->
    <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3" opacity="0.4">
        <line x1="130" y1="105" x2="140" y2="105"/>
        <line x1="260" y1="105" x2="295" y2="100"/>
        <line x1="260" y1="220" x2="290" y2="210"/>
        <line x1="100" y1="220" x2="140" y2="220"/>
    </g>

    <!-- Animated dots -->
    <circle r="3" fill="#10B981">
        <animateMotion dur="2s" repeatCount="indefinite" path="M130 105L140 105"/>
    </circle>
    <circle r="3" fill="#6366F1">
        <animateMotion dur="2.5s" repeatCount="indefinite" path="M260 105L295 100"/>
    </circle>
</svg>