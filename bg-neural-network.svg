<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
    <defs>
        <linearGradient id="neuralBg1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0A0E1A"/>
            <stop offset="50%" stop-color="#111827"/>
            <stop offset="100%" stop-color="#0A0E1A"/>
        </linearGradient>
        <radialGradient id="neuralGlow1" cx="30%" cy="40%" r="35%">
            <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="neuralGlow2" cx="70%" cy="60%" r="35%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
        </radialGradient>
        <filter id="neuralBlur">
            <feGaussianBlur stdDeviation="50"/>
        </filter>
    </defs>

    <rect width="1920" height="1080" fill="url(#neuralBg1)"/>
    <ellipse cx="576" cy="432" rx="500" ry="350" fill="url(#neuralGlow1)" filter="url(#neuralBlur)"/>
    <ellipse cx="1344" cy="648" rx="500" ry="350" fill="url(#neuralGlow2)" filter="url(#neuralBlur)"/>

    <!-- Neural network nodes and connections -->
    <g stroke="#6366F1" stroke-width="0.5" opacity="0.12" fill="none">
        <line x1="200" y1="200" x2="500" y2="300"/>
        <line x1="200" y1="200" x2="400" y2="500"/>
        <line x1="200" y1="200" x2="600" y2="200"/>
        <line x1="500" y1="300" x2="800" y2="250"/>
        <line x1="500" y1="300" x2="700" y2="500"/>
        <line x1="500" y1="300" x2="900" y2="400"/>
        <line x1="400" y1="500" x2="700" y2="500"/>
        <line x1="400" y1="500" x2="600" y2="700"/>
        <line x1="400" y1="500" x2="800" y2="600"/>
        <line x1="600" y1="200" x2="900" y2="150"/>
        <line x1="600" y1="200" x2="1000" y2="350"/>
        <line x1="800" y1="250" x2="1100" y2="300"/>
        <line x1="800" y1="250" x2="1000" y2="500"/>
        <line x1="700" y1="500" x2="1000" y2="500"/>
        <line x1="700" y1="500" x2="900" y2="700"/>
        <line x1="700" y1="500" x2="1100" y2="600"/>
        <line x1="900" y1="400" x2="1200" y2="450"/>
        <line x1="900" y1="400" x2="1100" y2="600"/>
        <line x1="900" y1="400" x2="1300" y2="350"/>
        <line x1="1000" y1="500" x2="1300" y2="550"/>
        <line x1="1000" y1="500" x2="1200" y2="700"/>
        <line x1="1100" y1="300" x2="1400" y2="400"/>
        <line x1="1100" y1="600" x2="1400" y2="600"/>
        <line x1="1100" y1="600" x2="1300" y2="800"/>
        <line x1="600" y1="700" x2="900" y2="700"/>
        <line x1="600" y1="700" x2="800" y2="900"/>
        <line x1="600" y1="700" x2="1000" y2="800"/>
        <line x1="900" y1="700" x2="1200" y2="700"/>
        <line x1="900" y1="700" x2="1100" y2="900"/>
        <line x1="900" y1="700" x2="1300" y2="800"/>
        <line x1="1200" y1="450" x2="1500" y2="500"/>
        <line x1="1200" y1="700" x2="1500" y2="650"/>
        <line x1="1200" y1="700" x2="1400" y2="850"/>
        <line x1="1300" y1="550" x2="1600" y2="600"/>
        <line x1="1300" y1="800" x2="1600" y2="750"/>
        <line x1="1300" y1="800" x2="1500" y2="950"/>
    </g>

    <!-- Neural nodes -->
    <g opacity="0.25">
        <circle cx="200" cy="200" r="6" fill="#6366F1"/>
        <circle cx="500" cy="300" r="5" fill="#8B5CF6"/>
        <circle cx="400" cy="500" r="5" fill="#6366F1"/>
        <circle cx="600" cy="200" r="5" fill="#06B6D4"/>
        <circle cx="800" cy="250" r="4" fill="#6366F1"/>
        <circle cx="700" cy="500" r="6" fill="#8B5CF6"/>
        <circle cx="600" cy="700" r="5" fill="#06B6D4"/>
        <circle cx="900" cy="400" r="4" fill="#6366F1"/>
        <circle cx="1000" cy="500" r="5" fill="#06B6D4"/>
        <circle cx="1100" cy="300" r="4" fill="#8B5CF6"/>
        <circle cx="900" cy="700" r="6" fill="#6366F1"/>
        <circle cx="1200" cy="450" r="5" fill="#06B6D4"/>
        <circle cx="1300" cy="550" r="4" fill="#6366F1"/>
        <circle cx="1100" cy="600" r="5" fill="#8B5CF6"/>
        <circle cx="800" cy="900" r="5" fill="#06B6D4"/>
        <circle cx="1000" cy="800" r="4" fill="#6366F1"/>
        <circle cx="1300" cy="800" r="5" fill="#8B5CF6"/>
        <circle cx="1200" cy="700" r="6" fill="#06B6D4"/>
        <circle cx="1400" cy="400" r="4" fill="#6366F1"/>
        <circle cx="1400" cy="600" r="5" fill="#06B6D4"/>
        <circle cx="1400" cy="850" r="4" fill="#8B5CF6"/>
        <circle cx="1500" cy="500" r="5" fill="#6366F1"/>
        <circle cx="1500" cy="650" r="4" fill="#06B6D4"/>
        <circle cx="1600" cy="600" r="6" fill="#8B5CF6"/>
        <circle cx="1600" cy="750" r="5" fill="#6366F1"/>
        <circle cx="1500" cy="950" r="4" fill="#06B6D4"/>
        <circle cx="1300" cy="350" r="4" fill="#6366F1"/>
    </g>

    <!-- Floating particles -->
    <g opacity="0.2">
        <circle cx="300" cy="400" r="2" fill="#6366F1">
            <animate attributeName="cy" values="400;380;400" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="700" cy="300" r="1.5" fill="#06B6D4">
            <animate attributeName="cy" values="300;280;300" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1100" cy="500" r="2" fill="#8B5CF6">
            <animate attributeName="cy" values="500;480;500" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1500" cy="400" r="1.5" fill="#EC4899">
            <animate attributeName="cy" values="400;380;400" dur="3.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="500" cy="800" r="2" fill="#6366F1">
            <animate attributeName="cy" values="800;780;800" dur="4.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1000" cy="900" r="1.5" fill="#06B6D4">
            <animate attributeName="cy" values="900;880;900" dur="3.8s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg>