<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
    <defs>
        <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#06B6D4"/>
        </linearGradient>
        <linearGradient id="bubbleUser" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#818CF8"/>
        </linearGradient>
        <linearGradient id="bubbleAI" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F1F5F9"/>
            <stop offset="100%" stop-color="#E2E8F0"/>
        </linearGradient>
        <filter id="chatShadow" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.1"/>
        </filter>
    </defs>

    <!-- Main chat window -->
    <g filter="url(#chatShadow)">
        <rect x="40" y="20" width="320" height="310" rx="20" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Header -->
    <rect x="40" y="20" width="320" height="50" rx="20" fill="url(#aiGrad)"/>
    <rect x="40" y="50" width="320" height="20" fill="url(#aiGrad)"/>
    <circle cx="70" cy="45" r="12" fill="white" opacity="0.3"/>
    <path d="M66 45L70 41L74 45L70 49Z" fill="white"/>
    <text x="90" y="49" font-size="13" fill="white" font-family="Inter,sans-serif" font-weight="600">Zyvore AI Assistant</text>
    <circle cx="340" cy="45" r="6" fill="white" opacity="0.5"/>

    <!-- AI Message 1 -->
    <rect x="55" y="85" width="200" height="50" rx="12" fill="url(#bubbleAI)"/>
    <circle cx="70" cy="100" r="8" fill="url(#aiGrad)"/>
    <text x="85" y="97" font-size="10" fill="#64748B" font-family="Inter,sans-serif" font-weight="600">AI</text>
    <text x="65" y="115" font-size="11" fill="#334155" font-family="Inter,sans-serif">Hello! I'm Zyvore AI. How can I</text>
    <text x="65" y="128" font-size="11" fill="#334155" font-family="Inter,sans-serif">help you today?</text>

    <!-- User Message 1 -->
    <rect x="180" y="145" width="170" height="40" rx="12" fill="url(#bubbleUser)"/>
    <text x="195" y="162" font-size="11" fill="white" font-family="Inter,sans-serif">Show me delivery stats</text>
    <text x="195" y="175" font-size="11" fill="white" font-family="Inter,sans-serif">for last week</text>

    <!-- AI Message 2 with chart -->
    <rect x="55" y="195" width="240" height="90" rx="12" fill="url(#bubbleAI)"/>
    <circle cx="70" cy="210" r="8" fill="url(#aiGrad)"/>
    <text x="85" y="207" font-size="10" fill="#64748B" font-family="Inter,sans-serif" font-weight="600">AI</text>
    <text x="65" y="228" font-size="11" fill="#334155" font-family="Inter,sans-serif">Here's your delivery overview:</text>

    <!-- Mini chart -->
    <rect x="65" y="238" width="100" height="35" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
    <rect x="72" y="255" width="8" height="12" rx="1" fill="#6366F1" opacity="0.6"/>
    <rect x="84" y="248" width="8" height="19" rx="1" fill="#6366F1" opacity="0.7"/>
    <rect x="96" y="252" width="8" height="15" rx="1" fill="#6366F1" opacity="0.8"/>
    <rect x="108" y="243" width="8" height="24" rx="1" fill="#6366F1" opacity="0.9"/>
    <rect x="120" y="246" width="8" height="21" rx="1" fill="#6366F1"/>
    <rect x="132" y="250" width="8" height="17" rx="1" fill="#06B6D4"/>
    <rect x="144" y="244" width="8" height="23" rx="1" fill="#06B6D4"/>

    <!-- Stats row -->
    <rect x="175" y="238" width="110" height="35" rx="4" fill="white" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="185" y="252" font-size="8" fill="#64748B" font-family="Inter,sans-serif">DELIVERY RATE</text>
    <text x="185" y="266" font-size="14" fill="#10B981" font-family="Inter,sans-serif" font-weight="700">98.5%</text>

    <!-- Typing indicator -->
    <rect x="55" y="295" width="60" height="25" rx="8" fill="url(#bubbleAI)"/>
    <circle cx="70" cy="307" r="3" fill="#94A3B8">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="82" cy="307" r="3" fill="#94A3B8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="94" cy="307" r="3" fill="#94A3B8">
        <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Input bar -->
    <rect x="55" y="310" width="290" height="25" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.5"/>
    <text x="70" y="326" font-size="10" fill="#94A3B8" font-family="Inter,sans-serif">Type your message...</text>
    <circle cx="330" cy="322" r="10" fill="url(#aiGrad)"/>
    <path d="M326 322H334M334 322L331 319M334 322L331 325" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating elements -->
    <g opacity="0.8">
        <rect x="10" y="60" width="50" height="30" rx="8" fill="white" stroke="#E2E8F0" stroke-width="0.5" filter="url(#chatShadow)"/>
        <text x="35" y="78" text-anchor="middle" font-size="9" fill="#6366F1" font-family="Inter,sans-serif" font-weight="600">+40%</text>
    </g>
    <g opacity="0.8">
        <rect x="340" y="120" width="50" height="30" rx="8" fill="white" stroke="#E2E8F0" stroke-width="0.5" filter="url(#chatShadow)"/>
        <text x="365" y="138" text-anchor="middle" font-size="9" fill="#10B981" font-family="Inter,sans-serif" font-weight="600">Live</text>
    </g>
</svg>